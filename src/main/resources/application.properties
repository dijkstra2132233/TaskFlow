# ========== LOCAL DEV - MySQL ==========
spring.datasource.url=jdbc:mysql://localhost:3306/taskflowdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate manage the schema (update = don't drop existing data)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Don't run schema.sql automatically (we run it manually in Workbench)
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=8080
