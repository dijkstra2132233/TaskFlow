<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head('Projects')}"></th:block>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="page-header">
        <h1>Projects</h1>
        <a href="/projects/new" class="btn btn-primary" th:if="${isAdmin}">+ New Project</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div th:if="${projects == null || projects.isEmpty()}" class="card" style="text-align:center;padding:40px;">
        <p class="text-muted">No projects found.</p>
        <a href="/projects/new" class="btn btn-primary" style="margin-top:12px;" th:if="${isAdmin}">Create First Project</a>
    </div>

    <div class="card-grid" th:if="${projects != null && !projects.isEmpty()}">
        <div class="project-card" th:each="project : ${projects}">
            <div class="project-meta">
                <span class="badge"
                    th:classappend="${project.status.name() == 'ACTIVE' ? 'badge-active' : (project.status.name() == 'ON_HOLD' ? 'badge-onhold' : 'badge-completed')}"
                    th:text="${project.status}"></span>
                <span class="text-muted" th:text="${project.tasks.size()} + ' tasks'"></span>
                <span class="badge badge-overdue" th:if="${project.countOverdue() > 0}" th:text="${project.countOverdue()} + ' overdue'"></span>
            </div>

            <h3 th:text="${project.name}"></h3>
            <p th:text="${project.description != null ? #strings.abbreviate(project.description, 100) : 'No description'}"></p>

            <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">
                <span class="badge badge-todo" th:text="${project.countByStatus(T(com.taskmanager.model.TaskStatus).TODO)} + ' todo'"></span>
                <span class="badge badge-inprogress" th:text="${project.countByStatus(T(com.taskmanager.model.TaskStatus).IN_PROGRESS)} + ' in-progress'"></span>
                <span class="badge badge-done" th:text="${project.countByStatus(T(com.taskmanager.model.TaskStatus).DONE)} + ' done'"></span>
            </div>

            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-sm btn-primary">View Tasks</a>
                <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-sm btn-secondary" th:if="${isAdmin}">Edit</a>
                <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" style="display:inline"
                      th:if="${isAdmin}" onsubmit="return confirm('Delete this project and all its tasks?')">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </div>
            <div class="text-muted" style="margin-top:10px;font-size:12px;" th:text="'Owner: ' + ${project.owner.name}"></div>
        </div>
    </div>
</div>
</body>
</html>
