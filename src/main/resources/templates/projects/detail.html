<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head('Project Detail')}"></th:block>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">

    <div class="page-header">
        <div>
            <h1 th:text="${project.name}"></h1>
            <p class="text-muted" th:text="${project.description != null ? project.description : 'No description'}"></p>
        </div>
        <div style="display:flex;gap:8px;">
            <a href="/projects" class="btn btn-secondary">← Projects</a>
            <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-secondary" th:if="${isAdmin}">Edit</a>
            <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" style="display:inline"
                  th:if="${isAdmin}" onsubmit="return confirm('Delete project and all its tasks?')">
                <button class="btn btn-danger">Delete</button>
            </form>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <!-- Project Meta -->
    <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
            <span>Status: <span class="badge"
                th:classappend="${project.status.name() == 'ACTIVE' ? 'badge-active' : (project.status.name() == 'ON_HOLD' ? 'badge-onhold' : 'badge-completed')}"
                th:text="${project.status}"></span></span>
            <span class="text-muted" th:text="'Owner: ' + ${project.owner.name}"></span>
            <span class="text-muted" th:text="'Created: ' + ${#temporals.format(project.createdAt, 'dd MMM yyyy')}"></span>
            <span class="badge badge-todo" th:text="${project.countByStatus(T(com.taskmanager.model.TaskStatus).TODO)} + ' todo'"></span>
            <span class="badge badge-inprogress" th:text="${project.countByStatus(T(com.taskmanager.model.TaskStatus).IN_PROGRESS)} + ' in-progress'"></span>
            <span class="badge badge-done" th:text="${project.countByStatus(T(com.taskmanager.model.TaskStatus).DONE)} + ' done'"></span>
            <span class="badge badge-overdue" th:if="${project.countOverdue() > 0}" th:text="${project.countOverdue()} + ' overdue'"></span>
        </div>
    </div>

    <!-- NEW TASK FORM (Admin only) -->
    <div class="card" th:if="${isAdmin}" style="margin-bottom:20px;">
        <h2 style="margin-bottom:14px;">Add New Task</h2>
        <form th:action="@{/tasks/new}" method="post" th:object="${newTask}">
            <input type="hidden" name="projectId" th:value="${project.id}"/>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Task Title *</label>
                    <input type="text" th:field="*{title}" placeholder="e.g. Design login page" required/>
                    <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Assign To</label>
                    <select name="assignedUserId">
                        <option value="">-- Unassigned --</option>
                        <option th:each="u : ${allUsers}" th:value="${u.id}" th:text="${u.name + ' (' + u.role + ')'}"></option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Priority</label>
                    <select th:field="*{priority}">
                        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Due Date</label>
                    <input type="date" th:field="*{dueDate}"/>
                </div>
            </div>
            <div class="form-group" style="margin-top:12px;">
                <label>Description</label>
                <textarea th:field="*{description}" placeholder="Optional task details..." style="min-height:60px;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Task</button>
        </form>
    </div>

    <!-- TASK LIST -->
    <div class="card">
        <h2 style="margin-bottom:14px;">Tasks (<span th:text="${tasks.size()}"></span>)</h2>

        <div th:if="${tasks.isEmpty()}" style="text-align:center;padding:24px;color:#94a3b8;">
            No tasks yet. <span th:if="${isAdmin}">Add your first task above.</span>
        </div>

        <table th:if="${!tasks.isEmpty()}">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Assigned To</th>
                    <th>Due Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="task : ${tasks}" th:classappend="${task.overdue ? 'overdue-row' : ''}">
                    <td>
                        <div th:text="${task.title}" style="font-weight:500;"></div>
                        <div class="text-muted" style="font-size:12px;" th:if="${task.description != null && !task.description.isEmpty()}"
                             th:text="${#strings.abbreviate(task.description, 60)}"></div>
                    </td>
                    <td>
                        <!-- Member or Admin can update status -->
                        <form th:action="@{/tasks/{id}/status(id=${task.id})}" method="post">
                            <select name="status" onchange="this.form.submit()"
                                    style="padding:4px 8px;font-size:12px;border-radius:4px;border:1px solid #d1d5db;background:#fff;">
                                <option th:each="s : ${statuses}"
                                        th:value="${s}" th:text="${s}"
                                        th:selected="${task.status == s}"></option>
                            </select>
                        </form>
                    </td>
                    <td>
                        <span class="badge"
                            th:classappend="'badge-' + ${task.priority.name().toLowerCase()}"
                            th:text="${task.priority}"></span>
                    </td>
                    <td th:text="${task.assignedTo != null ? task.assignedTo.name : 'Unassigned'}" class="text-muted"></td>
                    <td>
                        <span th:if="${task.dueDate != null}" th:text="${task.dueDate}"
                              th:style="${task.overdue ? 'color:#dc2626;font-weight:600;' : ''}"></span>
                        <span th:if="${task.dueDate == null}" class="text-muted">—</span>
                        <span class="badge badge-overdue" th:if="${task.overdue}">OVERDUE</span>
                    </td>
                    <td>
                        <div style="display:flex;gap:6px;">
                            <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-sm btn-secondary" th:if="${isAdmin}">Edit</a>
                            <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" style="display:inline"
                                  th:if="${isAdmin}" onsubmit="return confirm('Delete this task?')">
                                <button type="submit" class="btn btn-sm btn-danger">Del</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
