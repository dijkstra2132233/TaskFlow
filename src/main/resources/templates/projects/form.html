<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head('Project Form')}"></th:block>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container" style="max-width:640px;">
    <div class="page-header">
        <h1 th:text="${project.id == null ? 'New Project' : 'Edit Project'}"></h1>
        <a href="/projects" class="btn btn-secondary">← Back</a>
    </div>

    <div class="form-card" style="max-width:100%;">
        <form th:action="${project.id == null ? '/projects/new' : '/projects/' + project.id + '/edit'}"
              method="post" th:object="${project}">

            <div class="form-group">
                <label>Project Name *</label>
                <input type="text" th:field="*{name}" placeholder="e.g. E-Commerce Platform" required/>
                <span class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" placeholder="What is this project about?"></textarea>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>

            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn btn-primary" th:text="${project.id == null ? 'Create Project' : 'Save Changes'}"></button>
                <a href="/projects" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
