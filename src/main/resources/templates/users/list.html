<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head('Users')}"></th:block>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="page-header">
        <h1>Team Members</h1>
        <a href="/register" class="btn btn-primary">+ Invite User</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Joined</th>
                    <th>Change Role</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u, stat : ${users}">
                    <td class="text-muted" th:text="${stat.index + 1}"></td>
                    <td style="font-weight:500;" th:text="${u.name}"></td>
                    <td class="text-muted" th:text="${u.email}"></td>
                    <td>
                        <span class="badge"
                            th:classappend="${u.role.name() == 'ADMIN' ? 'badge-admin' : 'badge-member'}"
                            th:text="${u.role}"></span>
                    </td>
                    <td class="text-muted" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}"></td>
                    <td>
                        <form th:action="@{/users/{id}/role(id=${u.id})}" method="post" style="display:flex;gap:6px;align-items:center;">
                            <select name="role" style="padding:4px 8px;font-size:12px;border-radius:4px;border:1px solid #d1d5db;">
                                <option value="ADMIN" th:selected="${u.role.name() == 'ADMIN'}">ADMIN</option>
                                <option value="MEMBER" th:selected="${u.role.name() == 'MEMBER'}">MEMBER</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-secondary"
                                    th:if="${u.email != currentUser.email}">Update</button>
                            <span class="text-muted" th:if="${u.email == currentUser.email}" style="font-size:12px;">(you)</span>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
