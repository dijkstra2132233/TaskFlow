<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | TaskFlow'">TaskFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }

        /* NAV */
        nav { background: #1e293b; color: white; padding: 12px 24px; display: flex; align-items: center; gap: 20px; }
        nav .brand { font-size: 20px; font-weight: bold; color: #60a5fa; text-decoration: none; }
        nav a { color: #cbd5e1; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 4px; }
        nav a:hover, nav a.active { background: #334155; color: white; }
        nav .spacer { flex: 1; }
        nav .user-info { font-size: 13px; color: #94a3b8; }
        nav .btn-logout { background: #ef4444; color: white; padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; text-decoration: none; }
        nav .btn-logout:hover { background: #dc2626; }

        /* LAYOUT */
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { font-size: 24px; color: #1e293b; }
        h2 { font-size: 20px; color: #1e293b; }

        /* CARDS */
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 8px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center; border-left: 4px solid #3b82f6; }
        .stat-card.green { border-color: #22c55e; }
        .stat-card.yellow { border-color: #eab308; }
        .stat-card.red { border-color: #ef4444; }
        .stat-card.purple { border-color: #a855f7; }
        .stat-card .num { font-size: 32px; font-weight: bold; color: #1e293b; }
        .stat-card .label { font-size: 13px; color: #64748b; margin-top: 4px; }

        /* BADGES */
        .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; }
        .badge-todo { background: #e2e8f0; color: #475569; }
        .badge-inprogress { background: #dbeafe; color: #1d4ed8; }
        .badge-done { background: #dcfce7; color: #15803d; }
        .badge-high { background: #fee2e2; color: #dc2626; }
        .badge-medium { background: #fef9c3; color: #854d0e; }
        .badge-low { background: #f0fdf4; color: #166534; }
        .badge-admin { background: #ede9fe; color: #7c3aed; }
        .badge-member { background: #e0f2fe; color: #0369a1; }
        .badge-active { background: #dcfce7; color: #15803d; }
        .badge-onhold { background: #fef9c3; color: #854d0e; }
        .badge-completed { background: #e0f2fe; color: #0369a1; }
        .badge-overdue { background: #fee2e2; color: #dc2626; }

        /* BUTTONS */
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; border: none; transition: background 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }

        /* FORMS */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        input[type=text], input[type=email], input[type=password], input[type=date],
        select, textarea {
            width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px;
            font-size: 14px; color: #1e293b; background: #fff;
        }
        input:focus, select:focus, textarea:focus { outline: 2px solid #3b82f6; border-color: transparent; }
        textarea { min-height: 90px; resize: vertical; }
        .form-error { color: #dc2626; font-size: 12px; margin-top: 4px; }
        .form-card { background: white; border-radius: 8px; padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); max-width: 560px; }

        /* ALERTS */
        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-info { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f8fafc; text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid #e2e8f0; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover td { background: #f8fafc; }

        /* PROJECT CARD */
        .project-card { background: white; border-radius: 8px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-top: 3px solid #3b82f6; }
        .project-card h3 { font-size: 16px; margin-bottom: 6px; }
        .project-card p { font-size: 13px; color: #64748b; margin-bottom: 10px; }
        .project-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
        .task-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
        .task-row:last-child { border-bottom: none; }

        /* MISC */
        .text-muted { color: #64748b; font-size: 13px; }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .overdue-row td { background: #fff5f5 !important; }
        .section-title { font-size: 16px; font-weight: 600; color: #1e293b; margin: 20px 0 12px; }
        hr { border: none; border-top: 1px solid #e2e8f0; margin: 20px 0; }
    </style>
</head>
<body th:fragment="navbar">
    <nav>
        <a class="brand" href="/dashboard">⚡ TaskFlow</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/projects">Projects</a>
        <a href="/users" sec:authorize="hasRole('ADMIN')">Users</a>
        <span class="spacer"></span>
        <span class="user-info" th:text="${currentUser != null ? currentUser.name + ' (' + currentUser.role + ')' : ''}"></span>
        &nbsp;
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="btn-logout" type="submit">Logout</button>
        </form>
    </nav>
</body>
</html>
