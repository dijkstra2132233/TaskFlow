<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head('Edit Task')}"></th:block>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container" style="max-width:640px;">
    <div class="page-header">
        <h1>Edit Task</h1>
        <a th:href="@{/projects/{id}(id=${task.project.id})}" class="btn btn-secondary">← Back to Project</a>
    </div>

    <div class="form-card" style="max-width:100%;">
        <form th:action="@{/tasks/{id}/edit(id=${task.id})}" method="post" th:object="${task}">
            <div class="form-group">
                <label>Task Title *</label>
                <input type="text" th:field="*{title}" required/>
                <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}"></textarea>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>Status</label>
                    <select th:field="*{status}">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select th:field="*{priority}">
                        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" th:field="*{dueDate}"/>
                </div>
                <div class="form-group">
                    <label>Assign To</label>
                    <select name="assignedUserId">
                        <option value="">-- Unassigned --</option>
                        <option th:each="u : ${allUsers}"
                                th:value="${u.id}"
                                th:text="${u.name + ' (' + u.role + ')'}"
                                th:selected="${task.assignedTo != null && task.assignedTo.id == u.id}">
                        </option>
                    </select>
                </div>
            </div>

            <div style="display:flex;gap:10px;margin-top:8px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/projects/{id}(id=${task.project.id})}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
