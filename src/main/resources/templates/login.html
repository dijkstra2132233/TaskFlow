<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head('Login')}"></th:block>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f4f6f9;">
<div style="width:100%;max-width:400px;padding:24px;">

    <div style="text-align:center;margin-bottom:28px;">
        <div style="font-size:36px;">⚡</div>
        <h1 style="font-size:26px;color:#1e293b;margin-top:8px;">TaskFlow</h1>
        <p class="text-muted">Project & Task Management</p>
    </div>

    <div class="form-card" style="max-width:100%;">
        <h2 style="margin-bottom:20px;">Sign In</h2>

        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-info" th:if="${param.logout == null && error == null && message == null}">
            Demo → Admin: <strong>admin@taskflow.com / admin123</strong><br>
            Member: <strong>alice@taskflow.com / member123</strong>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required autofocus/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••" required/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:10px;">Sign In</button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:14px;color:#64748b;">
            No account? <a href="/register" style="color:#3b82f6;text-decoration:none;">Register here</a>
        </p>
    </div>
</div>
</body>
</html>
