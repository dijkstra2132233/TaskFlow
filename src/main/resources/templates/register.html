<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head('Register')}"></th:block>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f4f6f9;">
<div style="width:100%;max-width:420px;padding:24px;">
    <div style="text-align:center;margin-bottom:24px;">
        <div style="font-size:36px;">⚡</div>
        <h1 style="font-size:24px;color:#1e293b;margin-top:8px;">Create Account</h1>
    </div>

    <div class="form-card" style="max-width:100%;">
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${user}">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{name}" placeholder="John Doe" required/>
                <span class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="you@example.com" required/>
                <span class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Min 6 characters" required/>
                <span class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:10px;">Create Account</button>
        </form>
        <p style="text-align:center;margin-top:16px;font-size:14px;color:#64748b;">
            Already have an account? <a href="/login" style="color:#3b82f6;text-decoration:none;">Sign In</a>
        </p>
    </div>
</div>
</body>
</html>
